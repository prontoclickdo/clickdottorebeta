<!DOCTYPE html>
<html lang="it">
<head>
    <script src="cookie-consent.js?v=3"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerca medici e prestazioni – Click Dottore</title>

    <script src="theme.js"></script>
    <link rel="stylesheet" href="theme.css">
    <link rel="icon" href="favicon.ico?v=3" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="icona-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icona-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icona-apple-180.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <script>
        tailwind.config = { theme: { extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: { skybrand: { 50: '#eff5fc', 100: '#dce8f8', 200: '#b9d1f0', 300: '#8db3e5', 400: '#5a8fd6', 500: '#2a71c8', 600: '#31579c', 700: '#284780', 800: '#213a66', 900: '#0f172a' } }
        } } };
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        html { -webkit-text-size-adjust: 100%; }
        @media (max-width: 767px) { input, select, textarea { font-size: 16px !important; } }
        [hidden] { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-3">
            <a href="/" class="flex items-center min-w-0">
                <picture><source srcset="logo-header-dark.png?v=2" media="(prefers-color-scheme: dark)"><img src="logo.png" alt="clickdottore.it - Sportello medico sanitario" class="h-11 sm:h-12 w-auto object-contain"></picture>
            </a>
            <a id="link-area" href="accedi.html" class="inline-flex items-center gap-2 px-4 py-2 border border-slate-300 rounded-xl text-sm font-semibold text-slate-700 hover:border-skybrand-400 transition"><i class="fa-solid fa-user"></i> <span>Accedi</span></a>
        </div>
    </header>

    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <a href="/" class="inline-flex items-center gap-2 text-sm font-semibold text-skybrand-600 hover:text-skybrand-700 mb-5"><i class="fa-solid fa-arrow-left"></i> Torna alla Home</a>

        <!-- Nuova ricerca -->
        <form id="form-cerca" class="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 mb-6 grid grid-cols-1 md:grid-cols-[1fr_1fr_auto] gap-3 items-end" autocomplete="off">
            <label class="block relative"><span class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Specializzazione, prestazione o medico</span>
                <input id="q" name="q" type="text" placeholder="Es. Cardiologia, Ecocardiogramma, Rossi" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-skybrand-200 focus:border-skybrand-400">
                <div id="sug-q" hidden class="absolute z-30 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-72 overflow-y-auto"></div>
            </label>
            <label class="block relative"><span class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Città o CAP</span>
                <input id="dove" name="dove" type="text" placeholder="Es. Matera, 75100" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-skybrand-200 focus:border-skybrand-400">
                <div id="sug-dove" hidden class="absolute z-30 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-72 overflow-y-auto"></div>
            </label>
            <button type="submit" class="px-6 py-2.5 bg-skybrand-500 hover:bg-skybrand-600 text-white font-semibold rounded-xl transition"><i class="fa-solid fa-magnifying-glass mr-1.5"></i>Cerca</button>
        </form>

        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-1 mb-5">
            <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-user-doctor text-skybrand-500"></i>
                <span id="results-title">Risultati di ricerca</span>
            </h1>
            <p class="text-sm text-slate-500">Hai cercato: <strong id="hai-cercato" class="text-skybrand-600">tutti i medici</strong></p>
        </div>

        <div id="elenco-medici" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </main>

    <footer class="bg-slate-900 text-slate-500 py-8 mt-auto">
        <div class="max-w-5xl mx-auto px-4 text-center text-xs space-y-2">
            <div class="flex flex-wrap justify-center gap-x-4 gap-y-1"><a href="/" class="hover:text-white transition">Home</a><a href="accedi.html" class="hover:text-white transition">Accedi</a><a href="termini.html" class="hover:text-white transition">Termini del servizio</a><a href="privacy.html" class="hover:text-white transition">Privacy</a><a href="#" data-cookie-settings class="hover:text-white transition">Preferenze cookie</a></div>
            <div>&copy; 2026 - Click Dottore. Tutti i diritti riservati.</div>
        </div>
    </footer>

    <script src="specializzazioni.js?v=1"></script>
    <script src="prestazioni-catalogo.js?v=1"></script>
    <script type="module">
        import { supabase, esc } from './app.js';
        import './ricerca.js?v=8';
        const $ = (id) => document.getElementById(id);

        // ---------------- ricerca indicata nell'indirizzo: sopravvive a ricarica, "indietro" e condivisione ----------------
        const params = new URLSearchParams(location.search);
        const q = (params.get('q') || '').trim();
        const dove = (params.get('dove') || '').trim();
        $('q').value = q;
        $('dove').value = dove;
        $('hai-cercato').textContent = [q, dove].filter(Boolean).join(' • ') || 'tutti i medici';
        document.title = `${q || dove ? [q, dove].filter(Boolean).join(' a ') : 'Tutti i medici'} – Click Dottore`;
        window.cercaMedici(q, dove);

        $('form-cerca').addEventListener('submit', (e) => {
            e.preventDefault();
            const p = new URLSearchParams();
            if ($('q').value.trim()) p.set('q', $('q').value.trim());
            if ($('dove').value.trim()) p.set('dove', $('dove').value.trim());
            location.href = `cerca.html${p.toString() ? `?${p}` : ''}`;
        });

        // ---------------- area personale o accesso ----------------
        const { data: sessione } = await supabase.auth.getSession();
        if (sessione.session) {
            const { data: prof } = await supabase.from('profili').select('ruolo').eq('id', sessione.session.user.id).maybeSingle();
            $('link-area').href = prof ? 'area.html' : 'area-paziente.html';
            $('link-area').querySelector('span').textContent = prof ? 'Area riservata' : 'La mia area';
        }

        // ---------------- suggerimenti (si aprono dopo almeno una lettera) ----------------
        const norm = (v) => String(v || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/['’`´.\-]+/g, ' ').replace(/\s+/g, ' ').trim();
        const perNome = (a, b) => a.nome.localeCompare(b.nome, 'it', { sensitivity: 'base' });
        const voci = [
            ...(window.SPECIALIZZAZIONI || []).map((nome) => ({ nome, tipo: '' })),
            ...(() => {
                const m = new Map();
                Object.values(window.CATALOGO_PRESTAZIONI || {}).forEach((l) => l.forEach(([nome]) => { if (!m.has(nome.toLowerCase())) m.set(nome.toLowerCase(), { nome, tipo: 'Prestazione' }); }));
                return [...m.values()];
            })(),
        ].map((v) => ({ ...v, norm: norm(v.nome) }));

        let comuni = null, caricamento = null;
        function caricaComuni() {
            if (caricamento) return caricamento;
            caricamento = fetch('https://cdn.jsdelivr.net/gh/matteocontrini/comuni-json@master/comuni.json')
                .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
                .then((dati) => {
                    comuni = dati.map((c) => {
                        const nome = String(c.nome || '').split('/')[0].trim();
                        const caps = (Array.isArray(c.cap) ? c.cap : [c.cap]).filter((x) => /^\d{5}$/.test(String(x)));
                        return { nome, sigla: c.sigla || '', norm: norm(nome), caps };
                    });
                    if (document.activeElement === $('dove')) suggerisci('dove');
                })
                .catch(() => { caricamento = null; });
            return caricamento;
        }

        let proposte = { q: [], dove: [] };
        function suggerisci(campo) {
            const box = $(`sug-${campo}`);
            const testo = $(campo).value;
            const t = norm(testo);
            if (!t) { box.hidden = true; return; }
            let elenco = [];
            if (campo === 'q') {
                const inizio = voci.filter((v) => v.norm.startsWith(t));
                const parola = voci.filter((v) => !v.norm.startsWith(t) && v.norm.split(/[\s(\/,]+/).some((w) => w.startsWith(t)));
                const ordina = (l) => [...l.filter((v) => !v.tipo).sort(perNome), ...l.filter((v) => v.tipo).sort(perNome)];
                elenco = [...ordina(inizio), ...ordina(parola)].slice(0, 40).map((v) => ({ valore: v.nome, testo: esc(v.nome), tag: v.tipo }));
            } else {
                if (!comuni) { caricaComuni(); return; }
                if (/^\d+$/.test(t)) {
                    elenco = comuni.filter((c) => c.caps.some((x) => x.startsWith(t))).slice(0, 30)
                        .map((c) => ({ valore: `${c.nome} (${c.sigla})`, testo: `${esc(c.nome)} <span class="text-slate-400">(${esc(c.sigla)})</span>`, tag: c.caps.find((x) => x.startsWith(t)) }));
                } else {
                    const inizio = comuni.filter((c) => c.norm.startsWith(t)).sort(perNome);
                    const parola = comuni.filter((c) => !c.norm.startsWith(t) && c.norm.includes(' ' + t)).sort(perNome);
                    elenco = [...inizio, ...parola].slice(0, 30)
                        .map((c) => ({ valore: `${c.nome} (${c.sigla})`, testo: `${esc(c.nome)} <span class="text-slate-400">(${esc(c.sigla)})</span>`, tag: c.caps[0] || '' }));
                }
            }
            proposte[campo] = elenco;
            box.innerHTML = elenco.length ? elenco.map((v, i) => `
                <button type="button" data-campo="${campo}" data-i="${i}" class="w-full text-left px-4 py-2 hover:bg-skybrand-50 text-sm text-slate-700 flex items-center justify-between gap-3">
                    <span class="min-w-0">${v.testo}</span>${v.tag ? `<span class="shrink-0 text-[11px] font-semibold text-slate-400">${esc(v.tag)}</span>` : ''}
                </button>`).join('') : '<div class="px-4 py-3 text-sm text-slate-500">Nessun risultato</div>';
            box.hidden = false;
        }

        ['q', 'dove'].forEach((campo) => {
            $(campo).addEventListener('input', () => suggerisci(campo));
            $(campo).addEventListener('focus', () => { if (campo === 'dove') caricaComuni(); });
            $(campo).addEventListener('keydown', (e) => {
                if (e.key === 'Escape') $(`sug-${campo}`).hidden = true;
            });
        });
        document.addEventListener('click', (e) => {
            const b = e.target.closest('[data-campo]');
            if (b) {
                const campo = b.dataset.campo;
                $(campo).value = proposte[campo][Number(b.dataset.i)].valore;
                $(`sug-${campo}`).hidden = true;
                return;
            }
            if (!e.target.closest('#q, #dove, #sug-q, #sug-dove')) { $('sug-q').hidden = true; $('sug-dove').hidden = true; }
        });
    </script>
</body>
</html>
