<!DOCTYPE html>
<html lang="it">
<head>
    <script src="cookie-consent.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scegli la password – Click Dottore</title>
    <meta name="robots" content="noindex">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="theme.css">
    <link rel="icon" href="favicon.ico?v=3" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="icona-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icona-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icona-apple-180.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <script>
        tailwind.config = { theme: { extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: { skybrand: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0284c7', 600: '#0369a1', 700: '#075985', 800: '#0c4a6e', 900: '#0f172a' } }
        } } };
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        html { -webkit-text-size-adjust: 100%; }
        @media (max-width: 767px) { input, select, textarea { font-size: 16px !important; } }
        [hidden] { display: none !important; }
        @media print { header, footer, .no-print { display: none !important; } body { background: #fff; } }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between gap-3">
            <a href="index.html" class="flex items-center min-w-0">
                <picture><source srcset="logo-header-dark.png?v=2" media="(prefers-color-scheme: dark)"><img src="logo.png" alt="clickdottore.it - Sportello medico sanitario" class="h-11 sm:h-12 w-auto object-contain"></picture>
            </a>
            <div id="testata-destra" class="flex items-center gap-3 text-sm"></div>
        </div>
    </header>
    <main class="flex-grow w-full max-w-md mx-auto px-4 sm:px-6 py-12">
        <section class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm">
            <div id="attesa" class="text-center text-sm text-slate-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Verifica del link...</div>
            <div id="vista-form" hidden>
                <h1 class="text-xl font-bold text-slate-900 mb-1">Scegli la tua password</h1>
                <p id="per-utente" class="text-sm text-slate-500 mb-6"></p>
                <form id="form-password" class="space-y-4" novalidate>
                    <label class="block"><span class="block text-xs font-semibold text-slate-600 mb-1">Nuova password <span class="font-normal text-slate-400">(almeno 10 caratteri)</span></span>
                        <input name="password" type="password" autocomplete="new-password" minlength="10" required class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-skybrand-200 focus:border-skybrand-400"></label>
                    <label class="block"><span class="block text-xs font-semibold text-slate-600 mb-1">Ripeti la password</span>
                        <input name="conferma" type="password" autocomplete="new-password" required class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-skybrand-200 focus:border-skybrand-400"></label>
                    <div id="msg" hidden></div>
                    <button type="submit" id="btn-salva" class="w-full px-5 py-3 bg-skybrand-500 hover:bg-skybrand-600 text-white font-semibold rounded-xl transition disabled:opacity-60">Salva e accedi</button>
                </form>
            </div>
            <div id="vista-errore" hidden class="text-center space-y-3">
                <h1 class="text-lg font-bold text-slate-900">Link scaduto o non valido</h1>
                <p class="text-sm text-slate-500">Il link vale per un tempo limitato e si può usare una sola volta. Chiedine uno nuovo dalla pagina di accesso.</p>
                <a href="accedi.html" class="inline-block px-5 py-2.5 bg-skybrand-500 hover:bg-skybrand-600 text-white font-medium rounded-xl transition">Vai all'accesso</a>
            </div>
        </section>
    </main>
    <footer class="bg-slate-900 text-slate-500 py-8 mt-auto">
        <div class="max-w-5xl mx-auto px-4 text-center text-xs space-y-2">
            <div class="flex justify-center gap-4"><a href="index.html" class="hover:text-white transition">Home</a><a href="accedi.html" class="hover:text-white transition">Accedi</a><a href="#" data-cookie-settings class="hover:text-white transition">Preferenze cookie</a></div>
            <div>&copy; 2026 - Click Dottore. Tutti i diritti riservati.</div>
        </div>
    </footer>
    <script type="module">
        import { supabase, messaggio } from './app.js';
        const $ = (id) => document.getElementById(id);
        const mostra = (id) => ['attesa', 'vista-form', 'vista-errore'].forEach((v) => { $(v).hidden = v !== id; });

        const hash = new URLSearchParams(location.hash.slice(1));
        if (hash.get('error')) {
            mostra('vista-errore');
        } else {
            // il client legge da solo i token presenti nel link
            let pronto = false;
            const apri = (session) => {
                if (pronto || !session) return;
                pronto = true;
                $('per-utente').textContent = `Account: ${session.user.email}`;
                history.replaceState(null, '', location.pathname);
                mostra('vista-form');
            };
            supabase.auth.onAuthStateChange((_evento, session) => apri(session));
            const { data } = await supabase.auth.getSession();
            apri(data.session);
            setTimeout(() => { if (!pronto) mostra('vista-errore'); }, 6000);
        }

        $('form-password').addEventListener('submit', async (e) => {
            e.preventDefault();
            const f = e.currentTarget;
            $('msg').hidden = false;
            if (f.password.value.length < 10) return messaggio($('msg'), 'La password deve avere almeno 10 caratteri');
            if (f.password.value !== f.conferma.value) return messaggio($('msg'), 'Le due password non coincidono');
            $('btn-salva').disabled = true;
            const { error } = await supabase.auth.updateUser({ password: f.password.value });
            if (error) {
                messaggio($('msg'), /weak|short|pwned|leaked/i.test(error.message) ? 'Password troppo debole o già comparsa in fughe di dati: scegline un\'altra' : 'Salvataggio non riuscito, riprova');
                $('btn-salva').disabled = false;
                return;
            }
            location.replace('area.html');
        });
    </script>
</body>
</html>
