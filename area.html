<!DOCTYPE html>
<html lang="it">
<head>
    <script src="cookie-consent.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area riservata – Click Dottore</title>
    <meta name="robots" content="noindex">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="theme.css">
    <link rel="icon" href="favicon.ico?v=3" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="icona-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icona-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icona-apple-180.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <script>
        tailwind.config = { theme: { extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: { skybrand: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0284c7', 600: '#0369a1', 700: '#075985', 800: '#0c4a6e', 900: '#0f172a' } }
        } } };
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        html { -webkit-text-size-adjust: 100%; }
        @media (max-width: 767px) { input, select, textarea { font-size: 16px !important; } }
        [hidden] { display: none !important; }
        @media print { header, footer, .no-print { display: none !important; } body { background: #fff; } }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between gap-3">
            <a href="index.html" class="flex items-center min-w-0">
                <picture><source srcset="logo-header-dark.png?v=2" media="(prefers-color-scheme: dark)"><img src="logo.png" alt="clickdottore.it - Sportello medico sanitario" class="h-11 sm:h-12 w-auto object-contain"></picture>
            </a>
            <div id="testata-destra" class="flex items-center gap-3 text-sm"></div>
        </div>
    </header>
    <main class="flex-grow w-full max-w-6xl mx-auto px-4 sm:px-6 py-6">
        <div id="caricamento" class="text-center text-sm text-slate-500 py-16"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Caricamento...</div>
        <div id="bloccato" hidden class="max-w-md mx-auto bg-white border border-slate-200 rounded-2xl p-8 text-center space-y-3">
            <h1 class="text-lg font-bold text-slate-900">Utenza non abilitata</h1>
            <p class="text-sm text-slate-500">La tua utenza non è attiva o non ha un ruolo assegnato. Contatta l'amministratore di Click Dottore.</p>
            <button type="button" data-esci class="px-5 py-2.5 border border-slate-300 rounded-xl text-sm text-slate-700">Esci</button>
        </div>

        <div id="app" hidden>
            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3 mb-5">
                <div>
                    <h1 class="text-xl font-bold text-slate-900">Area riservata</h1>
                    <p id="sottotitolo" class="text-sm text-slate-500"></p>
                </div>
            </div>
            <nav id="schede" class="no-print flex gap-2 overflow-x-auto pb-1 mb-5"></nav>
            <div id="msg-globale" hidden class="mb-4"></div>
            <section id="vista"></section>
        </div>
    </main>

    <!-- Pannello di dettaglio prenotazione -->
    <div id="pannello" hidden class="fixed inset-0 z-50">
        <div data-chiudi class="absolute inset-0 bg-slate-900/50"></div>
        <aside class="absolute right-0 top-0 h-full w-full max-w-lg bg-white shadow-2xl overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-slate-200 px-5 py-4 flex items-center justify-between">
                <h2 class="font-bold text-slate-900">Dettaglio prenotazione</h2>
                <button type="button" data-chiudi aria-label="Chiudi" class="w-9 h-9 rounded-lg border border-slate-200 text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="pannello-corpo" class="p-5 space-y-5"></div>
        </aside>
    </div>
    <footer class="bg-slate-900 text-slate-500 py-8 mt-auto">
        <div class="max-w-5xl mx-auto px-4 text-center text-xs space-y-2">
            <div class="flex flex-wrap justify-center gap-x-4 gap-y-1"><a href="index.html" class="hover:text-white transition">Home</a><a href="accedi.html" class="hover:text-white transition">Accedi</a><a href="termini.html" class="hover:text-white transition">Termini del servizio</a><a href="#" data-cookie-settings class="hover:text-white transition">Preferenze cookie</a></div>
            <div>&copy; 2026 - Click Dottore. Tutti i diritti riservati.</div>
        </div>
    </footer>
    <script type="module" src="area.js"></script>
</body>
</html>
